
name: terraform deployment

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the reviewed Terraform plan"
        type: boolean
        default: false
      destroy:
        description: "DESTROY all Terraform-managed infrastructure"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-eks
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.16.5
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:

  # -----------------------------------------
  # 1. TERRAFORM INITIALIZATION & VALIDATION
  # -----------------------------------------
  init:
    name: terraform init & validate
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.destroy }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate


  # -----------------------------------------
  # 2. TERRAFORM SECURITY SCAN - TFSEC
  # -----------------------------------------
  tfsec:
    name: security scan (tfsec)
    needs: [init]
    if: ${{ needs.init.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true


  # -----------------------------------------
  # 3. SONARQUBE SECURITY ANALYSIS
  # -----------------------------------------
  sonar-scan:
    name: security scan (sonarqube)
    needs: [tfsec]
    if: ${{ needs.tfsec.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=ecommerce-eks-terraform-infrastructure
            -Dsonar.projectName=ecommerce-eks-terraform-infrastructure
            -Dsonar.exclusions=**/.terraform/**,**/*.tfstate
            -Dsonar.qualitygate.wait=true


  # -----------------------------------------
  # 4. TERRAFORM PLAN
  # Runs automatically on push to main
  # -----------------------------------------
  plan:
    name: terraform plan
    needs: [sonar-scan]
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.destroy }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -lock-timeout=5m -out=tfplan

      - name: Display Terraform Plan
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload Terraform Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: |
            tfplan
            tfplan.txt
          retention-days: 1
          if-no-files-found: error


  # -----------------------------------------
  # 5. TERRAFORM APPLY
  # Manual approval through workflow input
  # -----------------------------------------
  apply:
    name: terraform apply
    needs: [plan]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && !inputs.destroy }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Configure required reviewers under
    # GitHub Settings > Environments > production
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Download Terraform Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan

      - name: Apply Reviewed Terraform Plan
        run: terraform apply -lock-timeout=5m -auto-approve tfplan


  # -----------------------------------------
  # 6. VERIFY EKS INFRASTRUCTURE
  # Runs only after successful Apply
  # -----------------------------------------
  test:
    name: verify deployment
    needs: [apply]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read Terraform Outputs
        id: tf
        run: |
          terraform init
          echo "cluster=$(terraform output -raw eks_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "kubeconfig_uri=$(terraform output -raw kubeconfig_s3_uri)" >> "$GITHUB_OUTPUT"

      - name: Verify Cluster is ACTIVE
        run: |
          status=$(aws eks describe-cluster \
            --name "${{ steps.tf.outputs.cluster }}" \
            --query cluster.status --output text)
          test "$status" = "ACTIVE"

      - name: Connect kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "${{ steps.tf.outputs.cluster }}"

      - name: Verify Nodes are Ready
        run: kubectl wait --for=condition=Ready nodes --all --timeout=300s

      - name: Verify cert-manager
        run: kubectl -n cert-manager rollout status deployment --timeout=300s

      - name: Verify ClusterIssuer
        run: kubectl wait --for=condition=Ready clusterissuer --all --timeout=180s

      - name: Verify NGINX Ingress Controller
        run: kubectl -n nginx-ingress rollout status deployment --timeout=300s

      - name: Verify Load Balancer
        run: |
          lb=$(kubectl -n nginx-ingress get svc nginx-ingress-controller \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          test -n "$lb"

      - name: Verify Argo CD
        run: |
          kubectl -n argocd rollout status deployment --timeout=300s
          kubectl -n argocd rollout status statefulset --timeout=300s

      - name: Verify EFS CSI Driver and StorageClass
        run: |
          kubectl -n kube-system rollout status deployment/efs-csi-controller --timeout=300s
          kubectl get storageclass efs-sc

      - name: Verify Kubeconfig in S3
        run: aws s3 ls "${{ steps.tf.outputs.kubeconfig_uri }}"


  # -----------------------------------------
  # 7. TERRAFORM DESTROY
  # Separate manual operation
  # -----------------------------------------
  destroy:
    name: terraform destroy
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.destroy }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Require a separate production environment approval
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -lock-timeout=5m -auto-approve

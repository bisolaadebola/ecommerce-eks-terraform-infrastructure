name: terraform deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      destroy:
        description: "Tick to DESTROY all infrastructure"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-eks
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.16.5
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  init:
    name: terraform init & validate
    if: ${{ !inputs.destroy }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init
      - run: terraform fmt -check -recursive
      - run: terraform validate

  tfsec:
    name: security scan (tfsec)
    needs: [init]
    if: ${{ !cancelled() && !inputs.destroy }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true

  sonar-scan:
    name: security scan (sonarqube)
    needs: [tfsec]
    if: ${{ !cancelled() && !inputs.destroy }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@v5
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=ecommerce-eks-terraform-infrastructure
            -Dsonar.projectName=ecommerce-eks-terraform-infrastructure
            -Dsonar.exclusions=**/.terraform/**,**/*.tfstate
            -Dsonar.qualitygate.wait=true

  plan-apply:
    name: terraform plan and apply
    needs: [sonar-scan]
    if: ${{ !cancelled() && !inputs.destroy }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init
      - run: terraform plan -lock-timeout=5m -out=tfplan
      - run: terraform apply -lock-timeout=5m -auto-approve tfplan

  test:
    name: verify deployment
    needs: [plan-apply]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read Terraform outputs
        id: tf
        run: |
          terraform init
          echo "cluster=$(terraform output -raw eks_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "kubeconfig_uri=$(terraform output -raw kubeconfig_s3_uri)" >> "$GITHUB_OUTPUT"

      - name: Cluster is ACTIVE
        run: |
          status=$(aws eks describe-cluster --name "${{ steps.tf.outputs.cluster }}" --query cluster.status --output text)
          test "$status" = "ACTIVE"

      - name: Connect kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "${{ steps.tf.outputs.cluster }}"

      - name: Nodes are Ready
        run: kubectl wait --for=condition=Ready nodes --all --timeout=300s

      - name: cert-manager is running
        run: kubectl -n cert-manager rollout status deployment --timeout=300s

      - name: ClusterIssuer is Ready
        run: kubectl wait --for=condition=Ready clusterissuer --all --timeout=180s

      - name: NGINX ingress controller is running
        run: kubectl -n nginx-ingress rollout status deployment --timeout=300s

      - name: Load balancer has a hostname
        run: |
          lb=$(kubectl -n nginx-ingress get svc nginx-ingress-controller -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          test -n "$lb"

      - name: Argo CD is running
        run: |
          kubectl -n argocd rollout status deployment --timeout=300s
          kubectl -n argocd rollout status statefulset --timeout=300s

      - name: EFS CSI driver and StorageClass exist
        run: |
          kubectl -n kube-system rollout status deployment/efs-csi-controller --timeout=300s
          kubectl get storageclass efs-sc

      - name: kubeconfig is in S3
        run: aws s3 ls "${{ steps.tf.outputs.kubeconfig_uri }}"

  destroy:
    name: terraform destroy
    if: ${{ inputs.destroy }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init
      - run: terraform destroy -lock-timeout=5m -auto-approve